<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>الأسطورة | التحقق من الوثائق الرسمية</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #f4f6f8;
      color: #17202a;
    }

    header {
      background: #101827;
      color: white;
      text-align: center;
      padding: 28px 20px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 34px;
    }

    header p {
      margin: 0;
      font-size: 17px;
    }

    .container {
      max-width: 900px;
      margin: 45px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 35px;
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
    }

    h2 {
      text-align: center;
      margin: 0 0 8px;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 35px;
      font-size: 17px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
      font-size: 17px;
    }

    input {
      width: 100%;
      padding: 17px;
      border: 1px solid #ccd3da;
      border-radius: 12px;
      font-size: 18px;
      direction: ltr;
      text-align: left;
      outline: none;
    }

    input:focus {
      border-color: #17202a;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 17px;
      border: 0;
      border-radius: 12px;
      background: #101827;
      color: white;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1b2638;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .result {
      margin-top: 30px;
      padding: 25px;
      border-radius: 15px;
      display: none;
    }

    .success {
      background: #f0fff4;
      border: 1px solid #8fd19e;
      color: #17202a;
    }

    .error {
      background: #fff2f2;
      border: 1px solid #ff9c9c;
      color: #a52222;
    }

    .result h3 {
      text-align: center;
      margin-top: 0;
      font-size: 25px;
    }

    .details {
      margin-top: 20px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 14px 0;
      border-bottom: 1px solid #ddd;
    }

    .row:last-child {
      border-bottom: none;
    }

    .name {
      font-weight: bold;
    }

    .value {
      text-align: left;
    }

    footer {
      text-align: center;
      color: #777;
      margin: 35px 0;
      font-size: 14px;
    }

    @media (max-width: 600px) {

      .card {
        padding: 22px;
      }

      header h1 {
        font-size: 28px;
      }

      .row {
        flex-direction: column;
        gap: 5px;
      }

      .value {
        text-align: right;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>الأسطورة</h1>
  <p>نظام التحقق من الوثائق الرسمية</p>
</header>

<div class="container">

  <div class="card">

    <h2>التحقق من صحة الوثيقة</h2>

    <div class="subtitle">
      أدخل رمز التحقق الموجود على الوثيقة
    </div>

    <label for="verificationCode">
      رمز التحقق
    </label>

    <input
      type="text"
      id="verificationCode"
      autocomplete="off"
      placeholder="أدخل رمز التحقق"
    >

    <button
      id="verifyButton"
      onclick="verifyDocument()"
    >
      التحقق من الوثيقة
    </button>

    <div id="out" class="result"></div>

  </div>

</div>

<footer>
  نظام التحقق الإلكتروني للوثائق الرسمية © الأسطورة
</footer>


<script>

/* =====================================
   إعدادات Supabase
   ===================================== */

const SUPABASE_URL =
  "https://zhaqsifliwidyhfapxsk.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_-ZdfRe1d1YCe87QvwuEcAQ_f3oghzsC";


/* =====================================
   التحقق من الوثيقة
   ===================================== */

async function verifyDocument() {

  const input =
    window.document.getElementById("verificationCode");

  const button =
    window.document.getElementById("verifyButton");

  const out =
    window.document.getElementById("out");


  const code = input.value.trim();


  out.style.display = "none";
  out.innerHTML = "";


  if (!code) {

    showError("يرجى إدخال رمز التحقق الموجود على الوثيقة.");

    return;
  }


  button.disabled = true;
  button.textContent = "جارٍ التحقق...";


  try {

    const response = await fetch(
      SUPABASE_URL + "/rest/v1/rpc/verify_document",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY
        },

        body: JSON.stringify({
          p_code: code
        })
      }
    );


    const responseText =
      await response.text();


    console.log(
      "HTTP STATUS:",
      response.status
    );

    console.log(
      "SUPABASE RESPONSE:",
      responseText
    );


    let data;

    try {

      data = JSON.parse(responseText);

    } catch {

      data = null;

    }


    if (!response.ok) {

      showError(
        "حدث خطأ أثناء الاتصال بنظام التحقق."
      );

      console.error(
        "Supabase error:",
        responseText
      );

      return;
    }


    if (!data || data.length === 0) {

      showError(
        "رمز التحقق غير موجود أو أن الوثيقة غير مسجلة في النظام."
      );

      return;
    }


    /* مهم:
       استخدمنا doc بدل document
       حتى لا يحدث تعارض مع document الخاص بالمتصفح.
    */

    const doc = data[0];


    showSuccess(doc);

  }


  catch (error) {

    console.error(
      "Verification error:",
      error
    );

    showError(
      "حدث خطأ أثناء التحقق. حاول مرة أخرى."
    );

  }


  finally {

    button.disabled = false;
    button.textContent = "التحقق من الوثيقة";

  }

}


/* =====================================
   عرض الوثيقة الصحيحة
   ===================================== */

function showSuccess(doc) {

  const out =
    window.document.getElementById("out");


  out.className =
    "result success";


  out.innerHTML = `

    <h3>✓ الوثيقة صحيحة</h3>

    <div class="details">

      <div class="row">
        <span class="name">رقم الوثيقة</span>
        <span class="value">
          ${escapeHtml(doc.document_number || "-")}
        </span>
      </div>

      <div class="row">
        <span class="name">تاريخ الوثيقة</span>
        <span class="value">
          ${escapeHtml(doc.document_date || "-")}
        </span>
      </div>

      <div class="row">
        <span class="name">الجهة المستلمة</span>
        <span class="value">
          ${escapeHtml(doc.recipient || "-")}
        </span>
      </div>

      <div class="row">
        <span class="name">الموضوع</span>
        <span class="value">
          ${escapeHtml(doc.subject || "-")}
        </span>
      </div>

      <div class="row">
        <span class="name">الموقّع</span>
        <span class="value">
          ${escapeHtml(doc.signatory || "-")}
        </span>
      </div>

      <div class="row">
        <span class="name">الحالة</span>
        <span class="value">
          ${escapeHtml(doc.status || "-")}
        </span>
      </div>

    </div>
  `;


  out.style.display = "block";
}


/* =====================================
   عرض الخطأ
   ===================================== */

function showError(message) {

  const out =
    window.document.getElementById("out");


  out.className =
    "result error";


  out.innerHTML = `

    <h3>✕ تعذر التحقق</h3>

    <p style="text-align:center;">
      ${escapeHtml(message)}
    </p>

  `;


  out.style.display = "block";
}


/* =====================================
   حماية النصوص
   ===================================== */

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =====================================
   التحقق من الرابط المباشر
   مثال:
   ?code=AST-XXXXXXXX
   ===================================== */

window.addEventListener(
  "DOMContentLoaded",
  function () {

    const params =
      new URLSearchParams(
        window.location.search
      );


    const code =
      params.get("code");


    if (code) {

      window.document
        .getElementById("verificationCode")
        .value = code;

      verifyDocument();

    }

  }
);

</script>

</body>
</html>
