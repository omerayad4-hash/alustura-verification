<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الأسطورة | التحقق من الوثائق الرسمية</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Tahoma, sans-serif;
    background: #f4f6f8;
    color: #17202a;
}

header {
    background: #111827;
    color: white;
    padding: 28px 20px;
    text-align: center;
}

header h1 {
    margin: 0 0 8px;
    font-size: 30px;
}

header p {
    margin: 0;
    color: #d1d5db;
    font-size: 15px;
}

main {
    max-width: 760px;
    margin: 35px auto;
    padding: 0 18px;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
}

.title {
    text-align: center;
    margin-bottom: 25px;
}

.title h2 {
    margin: 0 0 8px;
    font-size: 24px;
}

.title p {
    color: #6b7280;
    margin: 0;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 9px;
}

input {
    width: 100%;
    padding: 15px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 16px;
    direction: ltr;
    text-align: left;
    outline: none;
}

input:focus {
    border-color: #111827;
}

button {
    width: 100%;
    margin-top: 15px;
    padding: 15px;
    border: 0;
    border-radius: 10px;
    background: #111827;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #1f2937;
}

.result {
    margin-top: 25px;
    padding: 20px;
    border-radius: 12px;
    display: none;
}

.success {
    border: 1px solid #86efac;
    background: #f0fdf4;
}

.error {
    border: 1px solid #fca5a5;
    background: #fef2f2;
    color: #991b1b;
}

.status {
    text-align: center;
    font-size: 21px;
    font-weight: bold;
    margin-bottom: 22px;
}

.success .status {
    color: #15803d;
}

.info {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

.item {
    background: #f8fafc;
    border-radius: 10px;
    padding: 14px;
}

.item strong {
    display: block;
    color: #6b7280;
    font-size: 13px;
    margin-bottom: 6px;
}

.item span {
    font-size: 15px;
    word-break: break-word;
}

.code {
    direction: ltr;
    text-align: left;
    font-family: monospace;
}

.loading {
    text-align: center;
    color: #6b7280;
    margin-top: 18px;
    display: none;
}

footer {
    text-align: center;
    color: #6b7280;
    font-size: 13px;
    padding: 20px;
}

@media (max-width: 600px) {

    .card {
        padding: 20px;
    }

    .info {
        grid-template-columns: 1fr;
    }

    header h1 {
        font-size: 24px;
    }
}
</style>
</head>

<body>

<header>
    <h1>الأسطورة</h1>
    <p>نظام التحقق من الوثائق الرسمية</p>
</header>

<main>

    <div class="card">

        <div class="title">
            <h2>التحقق من صحة الوثيقة</h2>
            <p>أدخل رمز التحقق الموجود على الوثيقة</p>
        </div>

        <label for="verificationCode">
            رمز التحقق
        </label>

        <input
            id="verificationCode"
            type="text"
            placeholder="مثال: AST-XXXX"
            autocomplete="off"
        >

        <button onclick="verifyDocument()">
            التحقق من الوثيقة
        </button>

        <div id="loading" class="loading">
            جارٍ التحقق من البيانات...
        </div>

        <div id="result" class="result"></div>

    </div>

</main>

<footer>
    نظام التحقق الإلكتروني للوثائق الرسمية © الأسطورة
</footer>


<script>

/* ==============================
   إعدادات Supabase
   ============================== */

const SUPABASE_URL =
    "https://zhaqsifliwidyhfapxsk.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_-ZdfRe1d1YCe87QvwuEcAQ_f3oghzsC";


/* ==============================
   التحقق من الوثيقة
   ============================== */

async function verifyDocument() {

    const input =
        document.getElementById("verificationCode");

    const result =
        document.getElementById("result");

    const loading =
        document.getElementById("loading");


    const code =
        input.value.trim().toUpperCase();


    result.style.display = "none";
    result.innerHTML = "";


    if (!code) {

        showError("يرجى إدخال رمز التحقق.");

        return;
    }


    loading.style.display = "block";


    try {

        const url =
            SUPABASE_URL +
            "/rest/v1/official_documents" +
            "?select=document_number,document_date,recipient,subject,signatory,status,verification_code" +
            "&verification_code=eq." +
            encodeURIComponent(code);


        const response = await fetch(url, {

            method: "GET",

            headers: {

                "apikey": SUPABASE_KEY,

                "Authorization":
                    "Bearer " + SUPABASE_KEY,

                "Content-Type":
                    "application/json"

            }

        });


        if (!response.ok) {

            throw new Error(
                "Database request failed"
            );
        }


        const documents =
            await response.json();


        loading.style.display = "none";


        if (!documents.length) {

            showError(
                "رمز التحقق غير موجود أو أن الوثيقة غير مسجلة في النظام."
            );

            return;
        }


        const doc =
            documents[0];


        showDocument(doc);


    } catch (error) {

        console.error(error);

        loading.style.display = "none";

        showError(
            "تعذر الاتصال بنظام التحقق. يرجى المحاولة مرة أخرى."
        );
    }
}


/* ==============================
   عرض الوثيقة الصحيحة
   ============================== */

function showDocument(doc) {

    const result =
        document.getElementById("result");


    let statusText = "";


    if (doc.status === "active") {

        statusText = "سارية وصحيحة";

    } else {

        statusText =
            doc.status || "غير محددة";
    }


    result.className =
        "result success";


    result.innerHTML = `

        <div class="status">
            ✓ الوثيقة صحيحة وموثقة
        </div>

        <div class="info">

            <div class="item">

                <strong>
                    رقم الوثيقة
                </strong>

                <span>
                    ${escapeHtml(
                        doc.document_number || "-"
                    )}
                </span>

            </div>


            <div class="item">

                <strong>
                    تاريخ الوثيقة
                </strong>

                <span>
                    ${escapeHtml(
                        doc.document_date || "-"
                    )}
                </span>

            </div>


            <div class="item">

                <strong>
                    الجهة المستلمة
                </strong>

                <span>
                    ${escapeHtml(
                        doc.recipient || "-"
                    )}
                </span>

            </div>


            <div class="item">

                <strong>
                    الموضوع
                </strong>

                <span>
                    ${escapeHtml(
                        doc.subject || "-"
                    )}
                </span>

            </div>


            <div class="item">

                <strong>
                    الموقّع
                </strong>

                <span>
                    ${escapeHtml(
                        doc.signatory || "-"
                    )}
                </span>

            </div>


            <div class="item">

                <strong>
                    حالة الوثيقة
                </strong>

                <span>
                    ${escapeHtml(
                        statusText
                    )}
                </span>

            </div>


            <div
                class="item"
                style="grid-column:1/-1;"
            >

                <strong>
                    رمز التحقق
                </strong>

                <span class="code">
                    ${escapeHtml(
                        doc.verification_code || "-"
                    )}
                </span>

            </div>

        </div>
    `;


    result.style.display =
        "block";
}


/* ==============================
   رسالة الخطأ
   ============================== */

function showError(message) {

    const result =
        document.getElementById("result");


    result.className =
        "result error";


    result.innerHTML = `

        <div class="status">
            ✕ تعذر التحقق
        </div>

        <div style="text-align:center;">
            ${escapeHtml(message)}
        </div>

    `;


    result.style.display =
        "block";
}


/* ==============================
   حماية عرض النصوص
   ============================== */

function escapeHtml(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


/* ==============================
   فتح الرابط مباشرة بالرمز
   مثال:
   ?code=AST-XXXX
   ============================== */

window.addEventListener(
    "DOMContentLoaded",
    () => {

        const params =
            new URLSearchParams(
                window.location.search
            );


        const code =
            params.get("code");


        if (code) {

            document
                .getElementById(
                    "verificationCode"
                )
                .value = code;


            verifyDocument();
        }

    }
);

</script>

</body>
</html>
