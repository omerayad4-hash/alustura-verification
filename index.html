<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>الأسطورة | التحقق من الوثائق الرسمية</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f6f8;
      color: #101827;
      font-family: Arial, Tahoma, sans-serif;
    }

    header {
      background: #101827;
      color: white;
      text-align: center;
      padding: 28px 20px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 34px;
    }

    header p {
      margin: 0;
      font-size: 17px;
    }

    .container {
      width: 90%;
      max-width: 900px;
      margin: 55px auto;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 38px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      margin: 0;
      font-size: 29px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-top: 10px;
      margin-bottom: 40px;
      font-size: 17px;
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 17px;
      margin-bottom: 10px;
    }

    input {
      width: 100%;
      height: 70px;
      border: 1px solid #ccd3da;
      border-radius: 13px;
      padding: 15px 20px;
      font-size: 20px;
      direction: ltr;
      text-align: left;
      outline: none;
    }

    input:focus {
      border-color: #101827;
    }

    button {
      width: 100%;
      height: 70px;
      margin-top: 20px;
      border: none;
      border-radius: 13px;
      background: #101827;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1c283a;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #result {
      margin-top: 30px;
      display: none;
      padding: 28px;
      border-radius: 16px;
    }

    .success {
      background: #f0fff4;
      border: 1px solid #8fd19e;
    }

    .error {
      background: #fff2f2;
      border: 1px solid #ff9999;
      color: #a52222;
    }

    .result-title {
      text-align: center;
      font-size: 27px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 14px 0;
      border-bottom: 1px solid #ddd;
      font-size: 17px;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      font-weight: bold;
    }

    .info-value {
      text-align: left;
    }

    footer {
      text-align: center;
      color: #777;
      margin: 35px 0;
      font-size: 14px;
    }

    @media (max-width: 600px) {

      .card {
        padding: 22px;
      }

      header h1 {
        font-size: 28px;
      }

      .info-row {
        flex-direction: column;
        gap: 6px;
      }

      .info-value {
        text-align: right;
      }
    }
  </style>
</head>


<body>

<header>

  <h1>الأسطورة</h1>

  <p>
    نظام التحقق من الوثائق الرسمية
  </p>

</header>


<div class="container">

  <div class="card">

    <h2>
      التحقق من صحة الوثيقة
    </h2>

    <div class="subtitle">
      أدخل رمز التحقق الموجود على الوثيقة
    </div>


    <label for="verificationCode">
      رمز التحقق
    </label>


    <input
      id="verificationCode"
      type="text"
      placeholder="أدخل رمز التحقق"
      autocomplete="off"
    >


    <button
      id="verifyButton"
      type="button"
    >
      التحقق من الوثيقة
    </button>


    <div id="result"></div>

  </div>

</div>


<footer>
  نظام التحقق الإلكتروني للوثائق الرسمية © الأسطورة
</footer>


<script>

/* =========================================
   SUPABASE
   ========================================= */

const SUPABASE_URL =
  "https://zhaqsifliwidyhfapxsk.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_-ZdfRe1d1YCe87QvwuEcAQ_f3oghzsC";


/* =========================================
   عناصر الصفحة
   ========================================= */

const codeInput =
  window["document"].getElementById("verificationCode");

const verifyButton =
  window["document"].getElementById("verifyButton");

const resultBox =
  window["document"].getElementById("result");


/* =========================================
   زر التحقق
   ========================================= */

verifyButton.addEventListener(
  "click",
  verifyDocument
);


/* =========================================
   التحقق
   ========================================= */

async function verifyDocument() {

  const code =
    codeInput.value.trim();


  resultBox.style.display = "none";
  resultBox.innerHTML = "";


  if (!code) {

    showError(
      "يرجى إدخال رمز التحقق."
    );

    return;
  }


  verifyButton.disabled = true;

  verifyButton.textContent =
    "جارٍ التحقق...";


  try {

    const response = await fetch(

      SUPABASE_URL +
      "/rest/v1/rpc/verify_document",

      {

        method: "POST",

        headers: {

          "Content-Type":
            "application/json",

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " + SUPABASE_KEY

        },

        body: JSON.stringify({

          p_code: code

        })

      }

    );


    const text =
      await response.text();


    console.log(
      "STATUS:",
      response.status
    );

    console.log(
      "RESPONSE:",
      text
    );


    if (!response.ok) {

      showError(
        "حدث خطأ في الاتصال بنظام التحقق."
      );

      console.error(text);

      return;
    }


    let data;

    try {

      data =
        JSON.parse(text);

    } catch {

      data = null;

    }


    if (
      !data ||
      !Array.isArray(data) ||
      data.length === 0
    ) {

      showError(
        "رمز التحقق غير موجود أو أن الوثيقة غير مسجلة في النظام."
      );

      return;
    }


    const record =
      data[0];


    showSuccess(record);

  }


  catch (error) {

    console.error(error);

    showError(
      "فشل الاتصال بالخادم."
    );

  }


  finally {

    verifyButton.disabled = false;

    verifyButton.textContent =
      "التحقق من الوثيقة";

  }

}


/* =========================================
   نجاح
   ========================================= */

function showSuccess(record) {

  resultBox.className =
    "success";

  resultBox.innerHTML = `

    <div class="result-title">
      ✓ الوثيقة صحيحة
    </div>

    <div class="info-row">
      <span class="info-label">
        رقم الوثيقة
      </span>

      <span class="info-value">
        ${safe(record.document_number)}
      </span>
    </div>


    <div class="info-row">
      <span class="info-label">
        تاريخ الوثيقة
      </span>

      <span class="info-value">
        ${safe(record.document_date)}
      </span>
    </div>


    <div class="info-row">
      <span class="info-label">
        الجهة المستلمة
      </span>

      <span class="info-value">
        ${safe(record.recipient)}
      </span>
    </div>


    <div class="info-row">
      <span class="info-label">
        الموضوع
      </span>

      <span class="info-value">
        ${safe(record.subject)}
      </span>
    </div>


    <div class="info-row">
      <span class="info-label">
        الموقّع
      </span>

      <span class="info-value">
        ${safe(record.signatory)}
      </span>
    </div>


    <div class="info-row">
      <span class="info-label">
        الحالة
      </span>

      <span class="info-value">
        ${safe(record.status)}
      </span>
    </div>

  `;


  resultBox.style.display =
    "block";
}


/* =========================================
   خطأ
   ========================================= */

function showError(message) {

  resultBox.className =
    "error";

  resultBox.innerHTML = `

    <div class="result-title">
      ✕ تعذر التحقق
    </div>

    <div style="text-align:center;">
      ${safe(message)}
    </div>

  `;


  resultBox.style.display =
    "block";
}


/* =========================================
   حماية النص
   ========================================= */

function safe(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return "-";

  }


  return String(value)

    .replaceAll("&", "&amp;")

    .replaceAll("<", "&lt;")

    .replaceAll(">", "&gt;")

    .replaceAll('"', "&quot;")

    .replaceAll("'", "&#039;");

}


/* =========================================
   قراءة code من الرابط
   مثال:
   ?code=AST-XXXXX
   ========================================= */

window.addEventListener(
  "DOMContentLoaded",
  function () {

    const params =
      new URLSearchParams(
        window.location.search
      );


    const urlCode =
      params.get("code");


    if (urlCode) {

      codeInput.value =
        urlCode;

      verifyDocument();

    }

  }
);

</script>

</body>

</html>
