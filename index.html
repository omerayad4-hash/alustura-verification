<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الأسطورة | التحقق من الوثائق الرسمية</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #f4f6f8;
      color: #17202a;
    }

    header {
      background: #101827;
      color: white;
      text-align: center;
      padding: 28px 20px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 34px;
    }

    header p {
      margin: 0;
      font-size: 17px;
    }

    .container {
      max-width: 900px;
      margin: 45px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 35px;
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
    }

    h2 {
      text-align: center;
      margin: 0 0 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 35px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 17px;
      border: 1px solid #ccd3da;
      border-radius: 12px;
      font-size: 18px;
      direction: ltr;
      text-align: left;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 17px;
      border: 0;
      border-radius: 12px;
      background: #101827;
      color: white;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    .result {
      margin-top: 30px;
      padding: 25px;
      border-radius: 15px;
      display: none;
    }

    .success {
      background: #f0fff4;
      border: 1px solid #8fd19e;
    }

    .error {
      background: #fff2f2;
      border: 1px solid #ff9c9c;
      color: #a52222;
    }

    .result h3 {
      text-align: center;
      margin-top: 0;
      font-size: 24px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      padding: 13px 0;
      border-bottom: 1px solid #ddd;
    }

    .name {
      font-weight: bold;
    }

    footer {
      text-align: center;
      color: #777;
      margin: 35px 0;
    }
  </style>
</head>

<body>

<header>
  <h1>الأسطورة</h1>
  <p>نظام التحقق من الوثائق الرسمية</p>
</header>

<div class="container">

  <div class="card">

    <h2>التحقق من صحة الوثيقة</h2>

    <div class="subtitle">
      أدخل رمز التحقق الموجود على الوثيقة
    </div>

    <label for="verificationCode">رمز التحقق</label>

    <input
      type="text"
      id="verificationCode"
      autocomplete="off"
      placeholder="أدخل رمز التحقق"
    >

    <button id="verifyButton" onclick="verifyDocument()">
      التحقق من الوثيقة
    </button>

    <div id="out" class="result"></div>

  </div>

</div>

<footer>
  نظام التحقق الإلكتروني للوثائق الرسمية © الأسطورة
</footer>

<script>

const SUPABASE_URL =
  "https://zhaqsifliwidyhfapxsk.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_-ZdfRe1d1YCe87QvwuEcAQ_f3oghzsC";


async function verifyDocument() {

  const code =
    document.getElementById("verificationCode").value.trim();

  const button =
    document.getElementById("verifyButton");

  const out =
    document.getElementById("out");

  out.style.display = "none";
  out.innerHTML = "";

  if (!code) {
    showError("يرجى إدخال رمز التحقق.");
    return;
  }

  button.disabled = true;
  button.textContent = "جارٍ التحقق...";

  try {

    const url =
      SUPABASE_URL + "/rest/v1/rpc/verify_document";

    const response = await fetch(url, {

      method: "POST",

      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      },

      body: JSON.stringify({
        p_code: code
      })

    });

    const responseText = await response.text();

    console.log("HTTP STATUS:", response.status);
    console.log("SUPABASE RESPONSE:", responseText);

    let data;

    try {
      data = JSON.parse(responseText);
    } catch {
      data = null;
    }

    /*
      إذا كان Supabase يرجع خطأ،
      سنعرض الخطأ الحقيقي بدل الرسالة العامة.
    */

    if (!response.ok) {

      showError(
        "خطأ من Supabase<br><br>" +
        "<b>HTTP:</b> " + response.status +
        "<br><br>" +
        "<b>التفاصيل:</b><br>" +
        escapeHtml(responseText)
      );

      return;
    }

    if (!data || data.length === 0) {

      showError(
        "رمز التحقق غير موجود في قاعدة البيانات."
      );

      return;
    }

    const document = data[0];

    showSuccess(document);

  }

  catch (error) {

    console.error(error);

    showError(
      "فشل الاتصال بالمخدم.<br><br>" +
      "<b>التفاصيل:</b><br>" +
      escapeHtml(error.message)
    );

  }

  finally {

    button.disabled = false;
    button.textContent = "التحقق من الوثيقة";

  }
}


function showSuccess(document) {

  const out = document.getElementById("out");

  out.className = "result success";

  out.innerHTML = `

    <h3>✓ الوثيقة صحيحة</h3>

    <div class="row">
      <span class="name">رقم الوثيقة</span>
      <span>${escapeHtml(document.document_number || "-")}</span>
    </div>

    <div class="row">
      <span class="name">تاريخ الوثيقة</span>
      <span>${escapeHtml(document.document_date || "-")}</span>
    </div>

    <div class="row">
      <span class="name">الجهة المستلمة</span>
      <span>${escapeHtml(document.recipient || "-")}</span>
    </div>

    <div class="row">
      <span class="name">الموضوع</span>
      <span>${escapeHtml(document.subject || "-")}</span>
    </div>

    <div class="row">
      <span class="name">الموقّع</span>
      <span>${escapeHtml(document.signatory || "-")}</span>
    </div>

    <div class="row">
      <span class="name">الحالة</span>
      <span>${escapeHtml(document.status || "-")}</span>
    </div>

  `;

  out.style.display = "block";
}


function showError(message) {

  const out = document.getElementById("out");

  out.className = "result error";

  out.innerHTML = `
    <h3>✕ تعذر التحقق</h3>
    <p style="text-align:center;">${message}</p>
  `;

  out.style.display = "block";
}


function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


window.addEventListener("DOMContentLoaded", function () {

  const params =
    new URLSearchParams(window.location.search);

  const code =
    params.get("code");

  if (code) {

    document.getElementById(
      "verificationCode"
    ).value = code;

    verifyDocument();

  }

});

</script>

</body>
</html>
