<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>أرشيف الأسطورة</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f4f5f7;
  font-family: Arial, Tahoma, sans-serif;
  color: #222;
}

.header {
  background: #111827;
  color: white;
  padding: 22px 18px;
  text-align: center;
}

.header h1 {
  margin: 0;
  font-size: 25px;
}

.header p {
  margin: 7px 0 0;
  color: #d1d5db;
  font-size: 14px;
}

.container {
  width: 100%;
  max-width: 600px;
  margin: auto;
  padding: 18px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 4px 18px rgba(0,0,0,.08);
}

.title {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 18px;
}

label {
  display: block;
  font-weight: bold;
  font-size: 14px;
  margin: 15px 0 7px;
}

input,
textarea {
  width: 100%;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  padding: 13px;
  font-size: 16px;
  font-family: inherit;
  outline: none;
}

input:focus,
textarea:focus {
  border-color: #111827;
}

textarea {
  min-height: 90px;
  resize: vertical;
}

.camera-box {
  margin-top: 20px;
  padding: 20px;
  text-align: center;
  border: 2px dashed #9ca3af;
  border-radius: 14px;
  background: #f9fafb;
}

.camera-icon {
  font-size: 42px;
}

.camera-text {
  font-weight: bold;
  margin: 8px 0 14px;
}

.file-input {
  width: 100%;
  background: white;
}

.preview {
  display: none;
  margin-top: 15px;
}

.preview img {
  width: 100%;
  max-height: 400px;
  object-fit: contain;
  border-radius: 10px;
  border: 1px solid #ddd;
}

.file-name {
  margin-top: 8px;
  font-size: 13px;
  color: #555;
  word-break: break-all;
}

.save-btn {
  width: 100%;
  margin-top: 22px;
  padding: 16px;
  border: 0;
  border-radius: 12px;
  background: #111827;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.save-btn:disabled {
  background: #9ca3af;
}

.message {
  display: none;
  margin-top: 15px;
  padding: 14px;
  border-radius: 10px;
  line-height: 1.8;
}

.success {
  display: block;
  background: #dcfce7;
  color: #166534;
}

.error {
  display: block;
  background: #fee2e2;
  color: #991b1b;
}

.archive-number {
  font-weight: bold;
  font-size: 18px;
}

.loading {
  display: none;
  text-align: center;
  margin-top: 15px;
  color: #555;
}
</style>
</head>

<body>

<div class="header">
  <h1>أرشيف الأسطورة</h1>
  <p>نظام أرشفة الوثائق</p>
</div>

<div class="container">

<div class="card">

<div class="title">
📁 أرشفة وثيقة جديدة
</div>

<label>رقم الوثيقة *</label>

<input
  id="documentNumber"
  type="text"
  placeholder="مثال: 123/2026"
>

<label>تاريخ الوثيقة</label>

<input
  id="documentDate"
  type="date"
>

<label>موضوع الوثيقة</label>

<input
  id="subject"
  type="text"
  placeholder="موضوع الوثيقة"
>

<label>الجهة المرسلة</label>

<input
  id="sender"
  type="text"
  placeholder="اسم الجهة"
>

<label>الجهة المستلمة</label>

<input
  id="recipient"
  type="text"
  placeholder="اسم الجهة"
>

<label>اسم الشخص</label>

<input
  id="personName"
  type="text"
  placeholder="اختياري"
>

<label>ملاحظات</label>

<textarea
  id="notes"
  placeholder="أي ملاحظات إضافية..."
></textarea>


<div class="camera-box">

<div class="camera-icon">📷</div>

<div class="camera-text">
تصوير أو اختيار الوثيقة
</div>

<input
  id="documentFile"
  class="file-input"
  type="file"
  accept="image/*,.pdf"
  capture="environment"
>

<div id="preview" class="preview">

<img id="previewImage">

<div id="fileName" class="file-name"></div>

</div>

</div>


<button
  id="saveBtn"
  class="save-btn"
  onclick="saveDocument()"
>
💾 حفظ الوثيقة
</button>

<div id="loading" class="loading">
⏳ جاري رفع الوثيقة وحفظ البيانات...
</div>

<div id="message" class="message"></div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://zhaqsifliwidyhfapxsk.supabase.co";

const SUPABASE_KEY =
"sb_publishable_-ZdfRe1d1YCe87QvwuEcAQ_f3oghzsC";

const BUCKET =
"archive-documents";


const fileInput =
document.getElementById("documentFile");

const preview =
document.getElementById("preview");

const previewImage =
document.getElementById("previewImage");

const fileName =
document.getElementById("fileName");

const saveBtn =
document.getElementById("saveBtn");

const message =
document.getElementById("message");

const loading =
document.getElementById("loading");


/* معاينة الصورة */

fileInput.addEventListener("change", function() {

  const file = this.files[0];

  if (!file) {

    preview.style.display = "none";

    return;
  }

  fileName.textContent =
    "الملف: " + file.name;


  if (file.type.startsWith("image/")) {

    const reader =
      new FileReader();

    reader.onload =
      function(event) {

        previewImage.src =
          event.target.result;

        preview.style.display =
          "block";

      };

    reader.readAsDataURL(file);

  } else {

    previewImage.removeAttribute("src");

    preview.style.display =
      "block";
  }

});


/* رسالة */

function showMessage(text, type) {

  message.className =
    "message " + type;

  message.innerHTML =
    text;

}


/* رقم الأرشيف */

function generateArchiveNumber() {

  const now =
    new Date();

  const year =
    now.getFullYear();

  const random =
    Math.floor(
      100000 +
      Math.random() * 900000
    );

  return "ARC-" +
    year +
    "-" +
    random;
}


/* حفظ الوثيقة */

async function saveDocument() {

  const documentNumber =
    document.getElementById(
      "documentNumber"
    ).value.trim();

  const documentDate =
    document.getElementById(
      "documentDate"
    ).value;

  const subject =
    document.getElementById(
      "subject"
    ).value.trim();

  const sender =
    document.getElementById(
      "sender"
    ).value.trim();

  const recipient =
    document.getElementById(
      "recipient"
    ).value.trim();

  const personName =
    document.getElementById(
      "personName"
    ).value.trim();

  const notes =
    document.getElementById(
      "notes"
    ).value.trim();

  const file =
    fileInput.files[0];


  if (!documentNumber) {

    showMessage(
      "⚠️ يرجى إدخال رقم الوثيقة.",
      "error"
    );

    return;
  }


  if (!file) {

    showMessage(
      "⚠️ يرجى تصوير الوثيقة أولاً.",
      "error"
    );

    return;
  }


  saveBtn.disabled = true;

  loading.style.display =
    "block";

  message.className =
    "message";


  try {

    /*
    إنشاء رقم الأرشيف
    */

    const archiveNumber =
      generateArchiveNumber();


    /*
    اسم الملف
    */

    const extension =
      file.name.includes(".")
      ? file.name
          .split(".")
          .pop()
          .toLowerCase()
      : "jpg";


    const fileNameSafe =
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2,10) +
      "." +
      extension;


    const filePath =
      archiveNumber +
      "/" +
      fileNameSafe;


    /*
    رفع الملف إلى Supabase Storage
    */

    const uploadURL =
      SUPABASE_URL +
      "/storage/v1/object/" +
      BUCKET +
      "/" +
      filePath;


    const uploadResponse =
      await fetch(
        uploadURL,
        {
          method: "POST",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY,

            "x-upsert":
              "false",

            "Content-Type":
              file.type ||
              "application/octet-stream"

          },

          body: file
        }
      );


    if (!uploadResponse.ok) {

      const errorText =
        await uploadResponse.text();

      throw new Error(
        "فشل رفع الملف: " +
        errorText
      );
    }


    /*
    حفظ بيانات الوثيقة
    */

    const databaseResponse =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/archive_documents",
        {
          method: "POST",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=representation"

          },

          body: JSON.stringify({

            archive_number:
              archiveNumber,

            document_number:
              documentNumber,

            document_date:
              documentDate ||
              null,

            subject:
              subject ||
              null,

            sender:
              sender ||
              null,

            recipient:
              recipient ||
              null,

            person_name:
              personName ||
              null,

            notes:
              notes ||
              null,

            file_path:
              filePath,

            file_type:
              file.type ||
              null

          })
        }
      );


    if (!databaseResponse.ok) {

      const errorText =
        await databaseResponse.text();

      throw new Error(
        "فشل حفظ بيانات الوثيقة: " +
        errorText
      );
    }


    /*
    نجاح
    */

    showMessage(

      "✅ تم حفظ الوثيقة بنجاح!" +

      "<br><br>" +

      "رقم الأرشيف:" +

      "<div class='archive-number'>" +

      archiveNumber +

      "</div>",

      "success"

    );


    /*
    تنظيف الحقول
    */

    document.getElementById(
      "documentNumber"
    ).value = "";

    document.getElementById(
      "documentDate"
    ).value = "";

    document.getElementById(
      "subject"
    ).value = "";

    document.getElementById(
      "sender"
    ).value = "";

    document.getElementById(
      "recipient"
    ).value = "";

    document.getElementById(
      "personName"
    ).value = "";

    document.getElementById(
      "notes"
    ).value = "";

    fileInput.value = "";

    preview.style.display =
      "none";


  } catch(error) {

    console.error(error);

    showMessage(

      "❌ حدث خطأ أثناء الحفظ." +

      "<br><br>" +

      error.message,

      "error"

    );

  }


  saveBtn.disabled =
    false;

  loading.style.display =
    "none";

}

</script>

</body>
</html>
